<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e9">
  <title>One More Joke</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", sans-serif;
      background: #f6f2e9;
      color: #24221f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 15%, #ffe3b5 0, transparent 30%),
        radial-gradient(ellipse at 90% 85%, #d7e8d2 0, transparent 32%),
        #f6f2e9;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #e8e1d5;
      border-radius: 28px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 24px 70px rgb(52 43 29 / 10%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #6b7953;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: -.06em;
      line-height: 1;
    }

    .emoji { display: block; margin-bottom: 18px; font-size: 3rem; }

    .joke {
      min-height: 130px;
      margin: 32px 0 26px;
      display: grid;
      align-content: center;
      gap: 14px;
      color: #45413b;
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      line-height: 1.55;
    }

    .joke p { margin: 0; }
    .delivery { font-weight: 750; color: #24221f; }
    .category { color: #777168; font-size: .85rem; }

    button {
      min-height: 54px;
      padding: 0 26px;
      border: 0;
      border-radius: 999px;
      background: #273d2c;
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    button:hover { transform: translateY(-2px); background: #38553e; }
    button:focus-visible { outline: 3px solid #d59b48; outline-offset: 4px; }
    button:disabled { cursor: wait; opacity: .7; transform: none; }

    .status { min-height: 1.5em; margin: 16px 0 0; color: #777168; font-size: .9rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">A little laugh, on demand</p>
    <h1><span class="emoji" aria-hidden="true">😄</span>One More Joke</h1>
    <section class="joke" aria-live="polite" aria-atomic="true" aria-label="Random joke">
      <p id="setup">Getting a joke ready…</p>
      <p id="delivery" class="delivery"></p>
      <p id="category" class="category"></p>
    </section>
    <button id="joke-button" type="button">Tell me another</button>
    <p id="status" class="status" role="status"></p>
  </main>

  <script>
    const setup = document.querySelector('#setup');
    const delivery = document.querySelector('#delivery');
    const category = document.querySelector('#category');
    const button = document.querySelector('#joke-button');
    const status = document.querySelector('#status');

    async function getJoke() {
      button.disabled = true;
      button.textContent = 'Finding a joke…';
      status.textContent = '';
      setup.textContent = 'One moment…';
      delivery.textContent = '';
      category.textContent = '';

      try {
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode');
        if (!response.ok) throw new Error('The joke service is unavailable right now.');

        const data = await response.json();
        if (data.error) throw new Error('The joke service returned an error.');

        if (data.type === 'twopart' && data.setup && data.delivery) {
          setup.textContent = data.setup;
          delivery.textContent = data.delivery;
        } else if (data.type === 'single' && data.joke) {
          setup.textContent = data.joke;
        } else {
          throw new Error('The joke service sent an unexpected response.');
        }
        category.textContent = data.category ? `A ${data.category.toLowerCase()} joke` : '';
      } catch (error) {
        setup.textContent = 'Looks like the joke got lost on the way.';
        status.textContent = `${error.message} Check your connection and try again.`;
      } finally {
        button.disabled = false;
        button.textContent = 'Tell me another';
      }
    }

    button.addEventListener('click', getJoke);
    getJoke();
  </script>
</body>
</html>
